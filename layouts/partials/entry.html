<article class="entry" data-section="{{ .Section }}"><div class="entry-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time><span>{{ .CurrentSection.Title }}</span></div><div class="entry-body"><h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3><p>{{ .Description }}</p><div class="tags"><span class="kind">{{ .Params.content_type | default "记录" }}</span>{{ range .Params.tags }}<a href="{{ printf "tags/%s/" (. | urlize) | relURL }}">{{ . }}</a>{{ end }}{{ if .Params.demo }}<span class="demo">示例内容</span>{{ end }}</div></div><a class="entry-arrow" href="{{ .RelPermalink }}" aria-label="阅读 {{ .Title }}">↗</a></article>
