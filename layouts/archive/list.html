{{ define "main" }}<section class="page-heading"><div class="eyebrow">ALL ENTRIES</div><h1>{{ .Title }}</h1><p>按时间翻阅，或者选择一个领域。</p></section><div class="filters" aria-label="按领域筛选"><button class="active" data-filter="all" aria-pressed="true">全部</button>{{ range sort (where .Site.Sections "Params.domain" true) "Weight" }}<button data-filter="{{ .Section }}" aria-pressed="false">{{ .Title }}</button>{{ end }}</div><div class="entries">{{ range where .Site.RegularPages "Params.content_type" "ne" nil }}{{ partial "entry.html" . }}{{ end }}</div><p id="filter-empty" hidden>这个领域还没有公开记录。</p>{{ end }}
